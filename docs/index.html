<!DOCTYPE html>

  <title>Banco Plata Knowledge Base - GitHub Pages v47.3 Usage Analytics</title>
  <style>
    :root {
      --bg: #fff8f3;

      font-weight: 800;

    .home-search-panel {

    .global-search-summary { color: var(--muted); font-size: 13px; font-weight: 800; }
    .global-result-group { border: 1px solid var(--line); background: #fff; border-radius: 18px; padding: 10px; }
    .global-result-group h3 { margin: 0 0 8px; font-size: 14px; color: var(--brand-dark); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .global-result-list { display: grid; gap: 8px; }
    .global-result-card {

    .home-gap-lite { border: 1px dashed rgba(255,93,21,.28); background: #fffaf6; border-radius: 16px; padding: 12px; display: grid; gap: 8px; }
    .home-gap-lite textarea { width: 100%; min-height: 84px; border: 1px solid var(--line); border-radius: 14px; padding: 11px; resize: vertical; font-family: inherit; }
    .home-gap-lite .feedback-actions { margin-top: 0; }
    .mini-note { color: var(--muted); font-size: 12px; font-weight: 700; }
    .fav-inline { border: 1px solid var(--line); background: white; color: var(--brand-dark); border-radius: 999px; padding: 10px 14px; font-weight: 900; cursor: pointer; }
    .fav-inline.active { background: var(--brand); color: white; border-color: var(--brand); }

    details.group {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;

    .badge {

      font-weight: 900;
      white-space: nowrap;
    }
    .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 0 14px 14px; }
    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      text-align: left;

    .card:hover { transform: translateY(-2px); border-color: rgba(255,93,21,.50); box-shadow: var(--shadow-soft); }
    .card h3 { margin: 0; font-size: 17px; line-height: 1.2; }
    .card p { margin: 0; color: var(--muted); line-height: 1.35; }
    .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }

    .governance-box { margin: 12px 0; border: 1px solid rgba(14,165,233,.25); background: #f0f9ff; color: #0c4a6e; border-radius: 18px; padding: 12px; }
    .governance-box h3 { margin: 0 0 8px; font-size: 15px; color: #0c4a6e; }
    .governance-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .governance-list div { background: rgba(255,255,255,.7); border: 1px solid rgba(14,165,233,.14); border-radius: 12px; padding: 8px; font-size: 13px; }
    .governance-list span { display: block; color: #64748b; font-size: 11px; font-weight: 900; text-transform: uppercase; margin-bottom: 2px; }
    .source-link { color: var(--brand-dark); font-weight: 900; word-break: break-word; }
    .empty-actions { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 10px; }
    .gap-btn, .copy-btn { border: 1px solid var(--brand); background: var(--brand); color: white; border-radius: 999px; padding: 10px 14px; font-weight: 900; cursor: pointer; }
    .secondary-btn { border: 1px solid var(--line); background: white; color: var(--ink); border-radius: 999px; padding: 10px 14px; font-weight: 900; cursor: pointer; }
    .gap-panel { display: none; margin-top: 12px; padding: 14px; border: 1px solid var(--line); background: #fff; border-radius: 18px; }
    .gap-panel.show { display: block; }
    .gap-panel label { display: block; margin: 0 0 8px; font-weight: 900; }

    .article-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }

    .empty, .loading, .error {
      background: white;

      border-radius: 20px;

    }
    .sheet-backdrop.show { opacity: 1; pointer-events: auto; }

      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translate(-50%, 110%);
      width: min(var(--max), 100%);
      max-height: 88vh;
      background: white;
      border-radius: 28px 28px 0 0;
      box-shadow: var(--shadow);
      z-index: 50;

      transition: transform .22s ease;

      backdrop: document.getElementById('backdrop'),
      sheet: document.getElementById('bottomSheet'),
      closeSheet: document.getElementById('closeSheet'),
      sheetTitle: document.getElementById('sheetTitle'),
      sheetSubtitle: document.getElementById('sheetSubtitle'),
      sheetBody: document.getElementById('sheetBody'),
      toast: document.getElementById('toast'),
      feedbackModal: document.getElementById('feedbackModal'),
      feedbackModalIcon: document.getElementById('feedbackModalIcon'),
      feedbackModalTitle: document.getElementById('feedbackModalTitle'),
      feedbackModalMessage: document.getElementById('feedbackModalMessage'),
      feedbackModalActions: document.getElementById('feedbackModalActions'),
      feedbackModalClose: document.getElementById('feedbackModalClose')
    };



    const CLIENT_CACHE_PREFIX = 'bp_kb_v41_instant_snapshot_';
    const CLIENT_ENTRY_MAX_AGE = 7 * 24 * 60 * 60 * 1000;
    const CLIENT_DETAIL_MAX_AGE = 7 * 24 * 60 * 60 * 1000;

    function clientCacheKey(type, id) {
      return CLIENT_CACHE_PREFIX + type + '_' + String(id || 'default');
    }

    function saveClientCache(type, id, data) {
      if (!data) return;
      try {
        const payload = {
          cachedAt: Date.now(),
          revision: (data && data.revision) || state.revision || '',
          data: data
        };
        const text = JSON.stringify(payload);
        // Avoid filling localStorage with very large records.
        if (text.length < 1200000) localStorage.setItem(clientCacheKey(type, id), text);
      } catch (e) {}
    }

    function loadClientCache(type, id, maxAge) {
      try {
        const raw = localStorage.getItem(clientCacheKey(type, id));
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (!parsed || !parsed.data || !parsed.cachedAt) return null;
        if (maxAge && Date.now() - Number(parsed.cachedAt || 0) > maxAge) return null;
        return parsed.data;
      } catch (e) {
        return null;
      }
    }

    function clearClientCaches() {
      try {
        Object.keys(localStorage).forEach(function(key) {
          if (key.indexOf(CLIENT_CACHE_PREFIX) === 0) localStorage.removeItem(key);
        });
      } catch (e) {}
    }

    function applyFreshRevision(revision) {
      if (!revision) return;
      const previous = state.revision || localStorage.getItem(CLIENT_CACHE_PREFIX + 'revision') || '';
      if (previous && previous !== revision) {
        clearClientCaches();
        state.entryPayloads = {};
        state.articleDetails = {};
        state.articleTexts = {};
        state.loadingFullDetails = {};
        state.loadingTextPrefetches = {};
        state.prefetchQueue = [];
      }
      state.revision = revision;
      try { localStorage.setItem(CLIENT_CACHE_PREFIX + 'revision', revision); } catch (e) {}
    }

    function updateRevisionFromPayload(payload) {
      if (payload && payload.revision) applyFreshRevision(payload.revision);
    }

    function checkKbRevision(silent) {
      google.script.run
        .withSuccessHandler(function(response) {
          if (response && response.revision) {
            const before = state.revision || localStorage.getItem(CLIENT_CACHE_PREFIX + 'revision') || '';
            applyFreshRevision(response.revision);
            if (before && before !== response.revision && state.entry) {
              loadEntryData(state.entry, true, true);
            }
          }
        })
        .withFailureHandler(function(err) {
          if (!silent) console.warn('No pudimos validar actualizaciones recientes', err);
        })
        .getKbRevision();
    }

    document.addEventListener('DOMContentLoaded', init);

    // v27 diagnostic safety net: if a runtime error happens, surface it instead of failing silently.
    window.addEventListener('error', function(event) {
      console.error('KB runtime error:', event.error || event.message);
      try { showToast('Error de interfaz. Revisa que Index y Code.gs estén actualizados.'); } catch (e) {}
    });

    function init() {
      els.homeBtn.addEventListener('click', goHome);
      els.changeEntryBtn.addEventListener('click', goHome);
      els.closeSheet.addEventListener('click', closeSheet);
      els.backdrop.addEventListener('click', closeSheet);
      document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeSheet(); });
      // v26: delegated click handler. This prevents cards from becoming non-clickable
      // after progressive rendering, re-renders, Google Sites iframe focus changes or stale listeners.
      document.addEventListener('click', handleDelegatedArticleClick, true);

      // Fast initial load: show the shell immediately.
      // Background refreshes are delayed slightly so first interaction remains responsive.
      renderHome();
      setTimeout(function() { preloadShellData(false); }, 650);
      setTimeout(function() { scheduleHomeEntryPrefetch(); }, 900);
      setTimeout(function() { checkKbRevision(true); }, 2200);
      setInterval(function() { checkKbRevision(true); }, 120000);
    }

    function preloadShellData(force) {
      google.script.run
        .withSuccessHandler(function(payload) {
          updateRevisionFromPayload(payload);
          state.shell = payload || null;
          if (payload) saveClientCache('shell', 'home', payload);
          if (!state.entry) renderHome();
        })
        .withFailureHandler(function(err) {
          console.warn('No se pudo cargar shell data en segundo plano', err);
        })
        .getKbShellData(!!force);
    }


    function scheduleHomeEntryPrefetch() {
      const entries = STATIC_ENTRY_POINTS.map(function(ep) { return ep.id; });
      const start = function() {
        entries.forEach(function(entryId, index) {
          setTimeout(function() { prefetchEntryPoint(entryId); }, 180 + index * 260);
        });
      };
      if (window.requestIdleCallback) window.requestIdleCallback(start, { timeout: 900 });
      else setTimeout(start, 650);
    }

    function prefetchEntryPoint(entryId) {
      const cleanEntry = String(entryId || '').trim();
      if (!cleanEntry || state.entryPayloads[cleanEntry] || state.loadingEntries[cleanEntry]) return;
      const cachedPayload = loadClientCache('entry', cleanEntry, CLIENT_ENTRY_MAX_AGE);
      if (cachedPayload && cachedPayload.items) {
        state.entryPayloads[cleanEntry] = cachedPayload;
        return;
      }
      loadEntryData(cleanEntry, false, true);
    }

    function openEntryPoint(entryId) {
      document.body.classList.add('has-entry-nav');
      state.entry = entryId;
      state.category = 'all';
      state.audience = 'all';
      state.query = '';
      els.topbar.hidden = false;

      const cachedPayload = state.entryPayloads[entryId] || loadClientCache('entry', entryId, CLIENT_ENTRY_MAX_AGE);
      if (cachedPayload && cachedPayload.items) {
        state.entryPayloads[entryId] = cachedPayload;
        state.data = cachedPayload;
        renderEntry();
        // Stale-while-revalidate: show cached cards immediately, then refresh silently.
        loadEntryData(entryId, false, true);
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      renderEntryLoading(entryId);
      loadEntryData(entryId, false, false);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderEntryLoading(entryId) {
      const ep = getEntryPoint(entryId);
      els.view.innerHTML = `
        <div class="loading entry-loading">
          <strong>Preparando ${escapeHtml(ep.label || 'contenido')}...</strong>
          <span>Estamos organizando los contenidos de esta sección.</span>
        </div>`;
    }

    function loadEntryData(entryId, force, silent) {
      const cleanEntry = entryId || state.entry;
      if (!cleanEntry) return;
      state.loadingEntries[cleanEntry] = true;

      google.script.run
        .withSuccessHandler(function(payload) {
          state.loadingEntries[cleanEntry] = false;
          updateRevisionFromPayload(payload);
          const normalizedPayload = payload || { items: [], categories: [], synonyms: [], entryPoints: STATIC_ENTRY_POINTS, counts: {} };
          state.entryPayloads[cleanEntry] = normalizedPayload;
          saveClientCache('entry', cleanEntry, normalizedPayload);
          if (state.entry === cleanEntry) {
            state.data = state.entryPayloads[cleanEntry];
            renderEntry();
          }
          // v37: do not trigger an extra shell refresh here; it adds latency with no user benefit.
        })
        .withFailureHandler(function(err) {
          state.loadingEntries[cleanEntry] = false;
          if (!silent) {
            const cached = loadClientCache('entry', cleanEntry, CLIENT_ENTRY_MAX_AGE);
            if (cached && cached.items) {
              state.entryPayloads[cleanEntry] = cached;
              state.data = cached;
              renderEntry();
              showToast('Mostrando la última versión disponible.');
              return;
            }
            els.view.innerHTML = '<div class="error"><strong>No pudimos abrir esta sección.</strong><br><span>Intenta actualizar la página. Si el problema continúa, repórtalo al equipo responsable.</span><br><small>' + escapeHtml(err.message || err) + '</small></div>';
          }
        })
        .getKbDataByEntryPoint(cleanEntry, !!force);
    }

    function loadData(force) {
      // Backward-compatible helper. In v23, refresh only reloads the selected entry point.
      if (state.entry) loadEntryData(state.entry, !!force);
      else preloadShellData(!!force);
    }

    function renderHome() {
      document.body.classList.remove('has-entry-nav');
      state.entry = null;
      state.query = '';
      state.category = 'all';
      els.topbar.hidden = true;
      const entryPoints = getEntryPoints();
      els.view.innerHTML = `
        <section class="search-panel home-search-panel">
          <div class="search-row">
            <input id="homeGlobalSearchInput" type="search" placeholder="Busca por palabra clave, duda, proceso o script..." value="${escapeAttr(state.homeSearchQuery || '')}" autocomplete="off">
            <button class="refresh-btn" id="homeGlobalClear" type="button">Limpiar</button>
          </div>
          <div class="filter-row">
            <span class="mini-note">Busca directamente o explora por sección.</span>
          </div>
          <div id="homeGlobalResults">${renderHomeGlobalResults()}</div>
        </section>

        <div class="section-title">
          <div>
            <h2>Explora por sección</h2>
            <p>Elige el camino que mejor se adapte a lo que necesitas consultar.</p>
          </div>
        </div>
        <div class="entry-grid">
          ${entryPoints.map(renderEntryCard).join('')}
        </div>
        ${renderHomePersonalization()}`;

      bindHomeGlobalSearchEvents();
      els.view.querySelectorAll('[data-entry]').forEach(function(btn) {
        btn.addEventListener('mouseenter', function() { prefetchEntryPoint(btn.dataset.entry); }, { passive: true });
        btn.addEventListener('focus', function() { prefetchEntryPoint(btn.dataset.entry); }, { passive: true });
        btn.addEventListener('touchstart', function() { prefetchEntryPoint(btn.dataset.entry); }, { passive: true });
        btn.addEventListener('click', function() {
          openEntryPoint(btn.dataset.entry);
        });
      });
      bindShelfOpenEvents();
    }

    function bindHomeGlobalSearchEvents() {
      const input = document.getElementById('homeGlobalSearchInput');
      const clearBtn = document.getElementById('homeGlobalClear');
      if (!input) return;

      input.addEventListener('input', debounce(function(e) {
        state.homeSearchQuery = e.target.value || '';
        const q = state.homeSearchQuery.trim();
        if (q.length < 2) {
          state.homeSearchResults = [];
          state.homeSearchTotal = 0;
          state.homeSearchLoading = false;
          state.homeSearchError = '';
          updateHomeGlobalResults();
          return;
        }
        runHomeGlobalSearch(q);
      }, 420));

      if (clearBtn) {
        clearBtn.addEventListener('click', function() {
          state.homeSearchQuery = '';
          state.homeSearchResults = [];
          state.homeSearchTotal = 0;
          state.homeSearchLoading = false;
          state.homeSearchError = '';
          updateHomeGlobalResults();
          input.value = '';
          input.focus();
        });
      }

      bindHomeGlobalResultEvents();
    }

    function runHomeGlobalSearch(query) {
      const requestId = Date.now() + Math.random();
      state.homeSearchRequestId = requestId;
      state.homeSearchLoading = true;
      state.homeSearchError = '';
      updateHomeGlobalResults();

      google.script.run
        .withSuccessHandler(function(payload) {
          if (state.homeSearchRequestId !== requestId) return;
          state.homeSearchLoading = false;
          updateRevisionFromPayload(payload);
          state.homeSearchResults = (payload && payload.results) ? payload.results : [];
          state.globalResultItems = state.globalResultItems || {};
          state.homeSearchResults.forEach(function(item) { if (item && item.id) state.globalResultItems[item.id] = item; });
          updateRevisionFromPayload(payload);
          state.homeSearchTotal = payload && payload.resultsCount ? payload.resultsCount : state.homeSearchResults.length;
          state.homeSearchError = '';
          updateHomeGlobalResults();
          scheduleGlobalSearchLog(state.homeSearchTotal);
        })
        .withFailureHandler(function(err) {
          if (state.homeSearchRequestId !== requestId) return;
          state.homeSearchLoading = false;
          state.homeSearchError = (err && err.message) ? err.message : String(err || 'No se pudo buscar.');
          updateHomeGlobalResults();
        })
        .globalSearchKb(query, 20);
    }

    function updateHomeGlobalResults() {
      const target = document.getElementById('homeGlobalResults');
      if (!target) return;
      target.innerHTML = renderHomeGlobalResults();
      bindHomeGlobalResultEvents();
    }

    function renderHomeGlobalResults() {
      const q = (state.homeSearchQuery || '').trim();
      if (!q) return '';
      if (q.length < 2) return '<div class="global-search-results"><div class="global-search-summary">Escribe al menos 2 caracteres para iniciar la búsqueda.</div></div>';
      if (state.homeSearchLoading) return '<div class="global-search-results"><div class="loading"><strong>Buscando...</strong><span>Revisando contenidos disponibles.</span></div></div>';
      if (state.homeSearchError) return '<div class="global-search-results"><div class="error"><strong>No pudimos completar la búsqueda.</strong><br><span>Intenta nuevamente en unos segundos.</span><br><small>' + escapeHtml(state.homeSearchError) + '</small></div></div>';
      if (!state.homeSearchResults.length) {
        return `
          <div class="global-search-results">
            <div class="empty no-results">
              <strong>No encontramos resultados para tu búsqueda.</strong>
              <p>Prueba con otra palabra clave o cuéntanos qué contenido esperabas encontrar.</p>
              <div class="empty-actions"><button type="button" class="gap-btn" id="homeContentGapBtn">Reportar contenido faltante</button></div>
              <div class="home-gap-lite" id="homeContentGapPanel" hidden>
                <label for="homeContentGapComment">¿Qué estabas buscando?</label>
                <textarea id="homeContentGapComment">${escapeHtml(q)}</textarea>
                <div class="feedback-actions">
                  <button type="button" id="homeCancelContentGap">Cancelar</button>
                  <button type="button" class="send" id="homeSendContentGap">Enviar solicitud</button>
                </div>
              </div>
            </div>
          </div>`;
      }

      const grouped = groupBy(state.homeSearchResults, function(item) { return item.entryLabel || item.entryPoint || 'Knowledge Base'; });
      const groups = Object.keys(grouped).sort().map(function(label) {
        const list = grouped[label];
        return `
          <div class="global-result-group">
            <h3><span>${escapeHtml(label)}</span><span class="badge">${list.length}</span></h3>
            <div class="global-result-list">
              ${list.map(renderGlobalResultCard).join('')}
            </div>
          </div>`;
      }).join('');

      const totalText = state.homeSearchTotal > state.homeSearchResults.length
        ? `${state.homeSearchResults.length} de ${state.homeSearchTotal} resultado(s)`
        : `${state.homeSearchResults.length} resultado(s)`;
      return `<div class="global-search-results"><div class="global-search-summary">${escapeHtml(totalText)} para “${q}”</div>${groups}</div>`;
    }

    function renderGlobalResultCard(item) {
      const meta = [item.entryLabel, item.category, item.subCategory].filter(Boolean).join(' / ');
      const media = [item.hasAudio ? 'Audio' : '', item.hasGallery ? 'Carrusel' : '', item.hasImage ? 'Imagen' : ''].filter(Boolean).join(' · ');
      return `
        <button class="global-result-card" type="button" data-global-open="${escapeAttr(item.id)}" data-global-entry="${escapeAttr(item.entryPoint)}">
          <span class="global-result-meta">${escapeHtml(meta)}</span>
          <strong>${escapeHtml(item.title)}</strong>
          <span>${escapeHtml(item.summary || 'Abrir contenido')}</span>
          ${media ? `<span>${escapeHtml(media)}</span>` : ''}
        </button>`;

    function handleDelegatedArticleClick(event) {
      const target = event.target;
      if (!target || !target.closest) return;

      const globalBtn = target.closest('[data-global-open]');
      if (globalBtn) {
        event.preventDefault();
        event.stopPropagation();
        openGlobalResult(globalBtn.dataset.globalOpen, globalBtn.dataset.globalEntry, globalBtn, event);
        return;
      }

      const articleBtn = target.closest('[data-open], [data-related]');
      if (!articleBtn) return;

      const id = articleBtn.dataset.open || articleBtn.dataset.related;
      if (!id) return;

      event.preventDefault();
      event.stopPropagation();
      openItem(id, articleBtn, event);
    }

    function bindHomeGlobalResultEvents() {
      const root = document.getElementById('homeGlobalResults');
      if (!root) return;
      root.querySelectorAll('[data-global-open]').forEach(function(btn) {
        btn.addEventListener('click', function(event) {
          openGlobalResult(btn.dataset.globalOpen, btn.dataset.globalEntry, btn, event);
        });
      });
      const gapBtn = document.getElementById('homeContentGapBtn');
      const gapPanel = document.getElementById('homeContentGapPanel');
      const gapCancel = document.getElementById('homeCancelContentGap');
      const gapSend = document.getElementById('homeSendContentGap');
      if (gapBtn && gapPanel) gapBtn.addEventListener('click', function() { gapPanel.hidden = false; });
      if (gapCancel && gapPanel) gapCancel.addEventListener('click', function() { gapPanel.hidden = true; });
      if (gapSend) gapSend.addEventListener('click', submitHomeContentGap);
    }

    function submitHomeContentGap() {
      const commentEl = document.getElementById('homeContentGapComment');
      const comment = commentEl ? commentEl.value.trim() : '';
      const query = (state.homeSearchQuery || '').trim();
      if (!query && !comment) return;
      showToast('Enviando solicitud...');
      google.script.run
        .withSuccessHandler(function() { showToast('Gracias, lo revisaremos'); })
        .withFailureHandler(function(err) { showToast('No pudimos enviar la solicitud'); console.error(err); })
        .submitContentGap({
          query: query,
          entryPoint: 'global',
          categoryFilter: 'all',
          comment: comment,
          userAgent: navigator.userAgent
        });
    }

    function scheduleGlobalSearchLog(resultsCount) {
      const query = (state.homeSearchQuery || '').trim();
      if (!query || query.length < 2) return;
      const key = 'global|' + normalizeText(query) + '|' + resultsCount;
      if (state.lastLoggedGlobalSearchKey === key) return;
      state.lastLoggedGlobalSearchKey = key;
      google.script.run
        .withFailureHandler(function(err) { console.warn('Global search log failed', err); })
        .logSearch({
          query: query,
          entryPoint: 'global',
          categoryFilter: 'all',
          resultsCount: resultsCount,
          userAgent: navigator.userAgent
        });
    }

    function openGlobalResult(id, entryPoint, triggerEl, clickEvent) {
      const cleanId = String(id || '').trim();
      if (!cleanId) return;

      // v37: open the selected article directly from the global search result.
      // Do not load the full entry point just to open one article.
      state.globalResultItems = state.globalResultItems || {};
      let searchItem = state.globalResultItems[cleanId] || null;
      if (!searchItem) {
        searchItem = (state.homeSearchResults || []).find(function(item) { return String(item.id || '').trim() === cleanId; }) || null;
      }
      if (searchItem) {
        state.articleDetails = state.articleDetails || {};
        // Store as a lightweight item so the modal can show title/summary immediately.
        if (!state.articleDetails[cleanId]) {
          state.articleDetails[cleanId] = Object.assign({}, searchItem, {
            entryPoint: searchItem.entryPoint || entryPoint || '',
            entryLabel: searchItem.entryLabel || ((ENTRY_POINT_MAP[searchItem.entryPoint || entryPoint] || {}).label || ''),
            isLite: true
          });
        }
      }

      openItem(cleanId, triggerEl, clickEvent);

      google.script.run
        .withFailureHandler(function(err) { console.warn('Selected global search log failed', err); })
        .logSearch({
          query: state.homeSearchQuery || '',
          entryPoint: 'global',
          categoryFilter: 'all',
          resultsCount: state.homeSearchTotal || 0,
          selectedArticleId: cleanId,
          selectedArticleTitle: (searchItem && searchItem.title) || '',
          userAgent: navigator.userAgent
        });
    }

    function renderEntryCard(ep) {

      if (ep.id === 'podcast') return 'Audios de refuerzo para repasar conceptos y buenas prácticas.';

    function renderEntry() {

      const showCurated = !state.query && state.category === 'all';

      els.view.innerHTML = `

            <h2>${escapeHtml(ep.label)}</h2>
            <p>${filtered.length} contenido(s) ${state.query ? 'encontrados' : 'disponibles'}</p>
          </div>
        </div>

        ${showCurated ? renderCuratedEntryPanels(allItems) : ''}
        <section id="results">
          ${filtered.length ? renderGroups(filtered) : renderNoResults()}
        </section>`;

      const searchInput = document.getElementById('searchInput');
      searchInput.addEventListener('input', debounce(function(e) {
        state.query = e.target.value;
        renderEntry();
        const el = document.getElementById('searchInput');
        el.focus();
        el.setSelectionRange(el.value.length, el.value.length);
      }, 180));

      document.getElementById('refreshBtn').addEventListener('click', function() {
        showToast('Actualizando contenido...');
        google.script.run
          .withSuccessHandler(function() {
            if (state.entry) delete state.entryPayloads[state.entry];
            loadEntryData(state.entry, true);
            showToast('Contenido actualizado');
          })
          .withFailureHandler(function(err) { showToast('No pudimos actualizar'); console.error(err); })
          .clearKbCache();
      });

      document.getElementById('categoryChips').querySelectorAll('[data-cat]').forEach(function(btn) {
        btn.addEventListener('click', function() {
          state.category = btn.dataset.cat;
          renderEntry();
        });

      els.view.querySelectorAll('[data-open]').forEach(function(btn) {
        btn.addEventListener('click', function(event) { openItem(btn.dataset.open, btn, event); });
      });
      const gapBtn = document.getElementById('contentGapBtn');
      const gapCancel = document.getElementById('cancelContentGap');
      const gapSend = document.getElementById('sendContentGap');
      if (gapBtn) gapBtn.addEventListener('click', showContentGapPanel);
      if (gapCancel) gapCancel.addEventListener('click', hideContentGapPanel);
      if (gapSend) gapSend.addEventListener('click', submitContentGapFromSearch);

      scheduleSearchLog(filtered.length);
      setupArticlePrefetch(filtered);
    }

    function renderNoResults() {
      const currentQuery = state.query || '';
      return `
        <div class="empty no-results">
          <strong>No encontramos resultados.</strong>
          <p>Prueba con otra palabra clave o reporta el contenido que esperabas encontrar.</p>
          <div class="empty-actions">
            <button type="button" class="gap-btn" id="contentGapBtn">Reportar contenido faltante</button>
          </div>
          <div class="gap-panel" id="contentGapPanel">
            <label for="contentGapComment">¿Qué estabas buscando?</label>
            <textarea id="contentGapComment" placeholder="Ejemplo: procedimiento para reembolso de Uber, explicación de OTP, script para objeción, etc.">${escapeHtml(currentQuery)}</textarea>
            <div class="feedback-actions">
              <button type="button" id="cancelContentGap">Cancelar</button>
              <button type="button" class="send" id="sendContentGap">Enviar solicitud</button>
            </div>
          </div>
        </div>`;
    }

    function renderGroups(items) {
      const groups = groupBy(items, function(item) { return item.category || 'Sin categoría'; });
      return Object.keys(groups).sort().map(function(category, i) {
        const groupItems = groups[category];
        return `
          <details class="group" ${i < 3 ? 'open' : ''}>
            <summary class="group-head"><span>${escapeHtml(category)}</span><span class="badge">${groupItems.length}</span></summary>
            <div class="cards">
              ${groupItems.map(renderItemCard).join('')}
            </div>
          </details>`;
      }).join('');
    }

    function renderItemCard(item) {
      // Visual cards intentionally show only user-facing labels.
      // Governance fields such as Tipo, Status, Revisión, Versión and Next review
      // remain available in la base, but are not displayed in the published KB cards.
      const tags = [
        item.badge ? { text: item.badge, cls: 'badge-main' } : null,
        item.subCategory ? { text: item.subCategory, cls: '' } : null,
        isFavorite(item.id) ? { text: '❤️ Favorito', cls: 'favorite' } : null,
        item.hasAudio ? { text: '🎧 Audio', cls: 'media' } : null,
        item.hasImage ? { text: '🖼 Imagen', cls: 'media' } : null,
        item.hasGallery ? { text: '▦ Galería', cls: 'media' } : null
      ].filter(Boolean).slice(0, 4);
      return `
        <button class="card" type="button" data-open="${escapeAttr(item.id)}">
          <h3>${escapeHtml(item.title)}</h3>
          <p>${escapeHtml(item.summary || 'Ver detalle completo.')}</p>
          <div class="tag-row">${tags.map(function(t) { return `<span class="tag ${escapeAttr(t.cls)}">${escapeHtml(t.text)}</span>`; }).join('')}</div>
        </button>`;
    }


    function renderGovernanceBox(item) {
      // Governance metadata is intentionally not displayed in the published KB.
      // Fields such as Tipo, Status, Revisión, Version and Next review remain in la base
      // for internal control, dashboards and review queues only.
      return '';
    }

    function shouldShowCopyButton(item) {
      if (!item || item.copyEnabled === false) return false;

      const entryPoint = normalizeText(item.entryPoint || '');
      const contentType = normalizeText(item.contentType || '');
      const category = normalizeText(item.category || '');
      const subCategory = normalizeText(item.subCategory || '');

      return entryPoint === 'scripts' ||
        contentType === 'script' ||
        contentType === 'scripts' ||
        category === 'script' ||
        category === 'scripts' ||
        subCategory === 'script' ||
        subCategory === 'scripts';
    }

    function formatSourceDocument(value) {
      const raw = String(value || '').trim();
      if (!raw) return '';
      if (/^https?:\/\//i.test(raw)) {
        return `<a class="source-link" href="${escapeAttr(raw)}" target="_blank" rel="noopener noreferrer">Abrir fuente</a>`;
      }
      return escapeHtml(raw);
    }

    function setupArticlePrefetch(items) {
      attachDetailPrefetchHandlers();
      scheduleEntryDetailPrefetch(items || []);
    }

    function attachDetailPrefetchHandlers() {
      const nodes = els.view.querySelectorAll('[data-open]');
      nodes.forEach(function(node) {
        if (node.dataset.prefetchBound === '1') return;
        node.dataset.prefetchBound = '1';
        const getId = function() { return node.dataset.open || ''; };
        node.addEventListener('mouseenter', function() { enqueueDetailPrefetch(getId(), 'hover'); }, { passive: true });
        node.addEventListener('focus', function() { enqueueDetailPrefetch(getId(), 'focus'); }, { passive: true });
        node.addEventListener('touchstart', function() { enqueueDetailPrefetch(getId(), 'touch'); }, { passive: true });
      });
    }

    function scheduleEntryDetailPrefetch(items) {
      if (!items || !items.length) return;
      // Prefetch only a small set, after cards are visible, so entry point load stays fast.
      const priorityItems = items
        .slice()
        .sort(function(a, b) {
          const aScore = (a.isFeatured ? 100 : 0) + (a.badge ? 20 : 0) + (isFavorite(a.id) ? 50 : 0);
          const bScore = (b.isFeatured ? 100 : 0) + (b.badge ? 20 : 0) + (isFavorite(b.id) ? 50 : 0);
          return bScore - aScore || sortItems(a, b);
        })
        .slice(0, 10);

      const start = function() {
        priorityItems.forEach(function(item) { enqueueDetailPrefetch(item.id, 'entry'); });
      };

      if (window.requestIdleCallback) {
        window.requestIdleCallback(start, { timeout: 800 });
      } else {
        setTimeout(start, 350);
      }
    }

    function enqueueDetailPrefetch(id, reason) {
      const cleanId = String(id || '').trim();
      if (!cleanId) return;
      state.articleDetails = state.articleDetails || {};
      state.loadingTextPrefetches = state.loadingTextPrefetches || {};
      state.prefetchQueue = state.prefetchQueue || [];

      if (state.articleTexts && state.articleTexts[cleanId]) return;
      const storedText = loadTextFromSession(cleanId);
      if (storedText) {
        state.articleTexts = state.articleTexts || {};
        state.articleTexts[cleanId] = storedText;
        mergeFullItemIntoEntryPayload(storedText);
        return;
      }
      if (state.loadingTextPrefetches[cleanId]) return;
      if (state.prefetchQueue.indexOf(cleanId) >= 0) return;

      state.prefetchQueue.push(cleanId);
      processDetailPrefetchQueue();
    }

    function processDetailPrefetchQueue() {
      state.prefetchQueue = state.prefetchQueue || [];
      state.activePrefetches = state.activePrefetches || 0;
      if (state.activePrefetches >= 1 || !state.prefetchQueue.length) return;

      const batch = [];
      while (state.prefetchQueue.length && batch.length < 4) {
        const id = state.prefetchQueue.shift();
        if (!id) continue;
        if ((state.articleDetails && state.articleDetails[id]) || (state.loadingTextPrefetches && state.loadingTextPrefetches[id])) continue;
        const cached = loadClientCache('detail', id, CLIENT_DETAIL_MAX_AGE);
        if (cached && cached.item) {
          const cachedItem = Object.assign({}, findItem(id) || {}, cached.item, { isLite: false, isTextOnly: false });
          state.articleDetails[id] = cachedItem;
          state.articleTexts[id] = Object.assign({}, cachedItem, { isTextOnly: true });
          mergeFullItemIntoEntryPayload(cachedItem);
          continue;
        }
        batch.push(id);
      }

      if (!batch.length) {
        if (state.prefetchQueue.length) setTimeout(processDetailPrefetchQueue, 0);
        return;
      }

      batch.forEach(function(id) { state.loadingTextPrefetches[id] = true; });
      state.activePrefetches += 1;

      google.script.run
        .withSuccessHandler(function(response) {
          state.activePrefetches = Math.max(0, (state.activePrefetches || 1) - 1);
          updateRevisionFromPayload(response);
          batch.forEach(function(id) { state.loadingTextPrefetches[id] = false; });
          const items = response && response.ok && response.items ? response.items : [];
          items.forEach(function(item) {
            if (!item || !item.id) return;
            const fullItem = Object.assign({}, findItem(item.id) || {}, item, { isLite: false, isTextOnly: false });
            state.articleDetails[item.id] = fullItem;
            state.articleTexts[item.id] = Object.assign({}, fullItem, { isTextOnly: true });
            mergeFullItemIntoEntryPayload(fullItem);
            saveClientCache('detail', item.id, { ok: true, item: fullItem, revision: (response && response.revision) || state.revision || '' });
            if (state.pendingDetailId === item.id || (state.currentItem && state.currentItem.id === item.id)) {
              renderItemDetail(fullItem, els.sheet, null, true);
            }
          });
          setTimeout(processDetailPrefetchQueue, 120);
        })
        .withFailureHandler(function(err) {
          state.activePrefetches = Math.max(0, (state.activePrefetches || 1) - 1);
          batch.forEach(function(id) { state.loadingTextPrefetches[id] = false; });
          console.warn('Prefetch detail batch failed', err);
          setTimeout(processDetailPrefetchQueue, 420);
        })
        .getKbItemsFastLiveBatch(batch, 4, false);
    }

    function detailSessionKey(id) {
      return 'bp_kb_detail_v35_' + String(id || '').trim();
    }

    function loadDetailFromSession(id) {
      // v31: do not reuse full article details from browser cache; KB_Content must stay live.
      return null;
    }

    function saveDetailToSession(item) {
      // v31: no-op. Full detail/media is lightweight and should stay fresh.
    }

    function openItem(id, triggerEl, clickEvent) {
      const cleanId = String(id || '').trim();
      if (!cleanId) return;

      state.articleDetails = state.articleDetails || {};
      state.articleTexts = state.articleTexts || {};
      state.loadingDetails = state.loadingDetails || {};
      state.loadingFullDetails = state.loadingFullDetails || {};
      state.contentFirstShown = state.contentFirstShown || {};

      let item = findItem(cleanId);
      if (!item) {
        item = {
          id: cleanId,
          entryPoint: state.entry || '',
          entryLabel: (ENTRY_POINT_MAP[state.entry] || {}).label || '',
          category: '',
          subCategory: '',
          title: 'Abriendo contenido',
          summary: '',
          isLite: true
        };
      }

      const cachedDetail = state.articleDetails[cleanId];
      if (cachedDetail && cachedDetail.contentHtml && !cachedDetail.isLite && !cachedDetail.isMediaOnly) {
        renderItemDetail(cachedDetail, triggerEl, clickEvent, false);
        // Revalidate silently so Sheet edits still appear automatically.
        loadItemFastLive(cleanId, cachedDetail, triggerEl, clickEvent, true);
        return;
      }

      const stored = loadClientCache('detail', cleanId, CLIENT_DETAIL_MAX_AGE);
      if (stored && stored.item && stored.item.contentHtml) {
        const storedItem = Object.assign({}, item, stored.item, { isLite: false, isTextOnly: false });
        state.articleDetails[cleanId] = storedItem;
        state.articleTexts[cleanId] = Object.assign({}, storedItem, { isTextOnly: true });
        mergeFullItemIntoEntryPayload(storedItem);
        renderItemDetail(storedItem, triggerEl, clickEvent, false);
        loadItemFastLive(cleanId, storedItem, triggerEl, clickEvent, true);
        return;
      }

      // Always show a visible modal immediately so the click never feels ignored.
      openItemLoading(item, triggerEl, clickEvent);
      loadItemFastLive(cleanId, item, triggerEl, clickEvent, false);
    }

    function loadItemFastLive(id, baseItem, triggerEl, clickEvent, silentRefresh) {
      state.loadingFullDetails = state.loadingFullDetails || {};
      state.articleDetails = state.articleDetails || {};
      if (!id) return;
      if (state.loadingFullDetails[id]) return;

      state.loadingFullDetails[id] = true;

      google.script.run
        .withSuccessHandler(function(response) {
          state.loadingFullDetails[id] = false;
          updateRevisionFromPayload(response);
          if (!response || !response.ok || !response.item) {
            if (!silentRefresh) showDetailError((response && response.error) || 'No pudimos abrir este contenido.');
            return;
          }

          const fullItem = Object.assign({}, baseItem || findItem(id) || {}, response.item, {
            isLite: false,
            isTextOnly: false,
            isMediaOnly: false
          });

          state.articleDetails[id] = fullItem;
          state.articleTexts[id] = Object.assign({}, fullItem, { isTextOnly: true });
          mergeFullItemIntoEntryPayload(fullItem);
          saveClientCache('detail', id, { ok: true, item: fullItem, revision: (response && response.revision) || state.revision || '' });

          if (state.pendingDetailId === id || (state.currentItem && state.currentItem.id === id)) {
            renderItemDetail(fullItem, triggerEl, clickEvent, !!silentRefresh);
          }
        })
        .withFailureHandler(function(err) {
          state.loadingFullDetails[id] = false;
          if (!silentRefresh) showDetailError((err && err.message) ? err.message : String(err || 'No pudimos abrir este contenido.'));
          console.warn('No se pudo cargar el detalle rápido', err);
        })
        .getKbItemFastLive(id, false);
    }

    function openItemLoading(item, triggerEl, clickEvent) {
      state.currentItem = item;
      state.feedbackSubmitting = false;
      state.pendingDetailId = item.id;
      els.sheetTitle.textContent = item.title || 'Abriendo contenido';
      els.sheetSubtitle.textContent = [item.entryLabel, item.category, item.subCategory].filter(Boolean).join(' / ');
      els.sheetBody.innerHTML = `
        ${item.summary ? `<p class="summary">${escapeHtml(item.summary)}</p>` : ''}
        <div class="detail-loading compact">
          <div class="detail-spinner"></div>
          <strong>Abriendo contenido...</strong>
          <span>Preparando la información para mostrarla.</span>
        </div>`;
      els.sheetBody.scrollTop = 0;
      positionDesktopModal(triggerEl, clickEvent);
      document.body.classList.add('modal-open');
      els.backdrop.classList.add('show');
      els.sheet.classList.add('show');
    }

    function textSessionKey(id) {
      return 'bp_kb_text_v35_' + String(id || '').trim();
    }

    function loadTextFromSession(id) {
      try {
        const key = textSessionKey(id);
        const raw = sessionStorage.getItem(key);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (!parsed || !parsed.item || !parsed.cachedAt) return null;
        const age = Date.now() - Number(parsed.cachedAt || 0);
        // Short cache only: enough for back-and-forth navigation, not enough to hide Sheet edits for long.
        if (age > 2 * 60 * 1000) {
          sessionStorage.removeItem(key);
          return null;
        }
        return Object.assign({}, parsed.item, { isLite: false, isTextOnly: true });
      } catch (e) {
        return null;
      }
    }

    function saveTextToSession(item) {
      if (!item || !item.id || !item.contentHtml) return;
      try {
        const payload = JSON.stringify({ cachedAt: Date.now(), item: item });
        if (payload.length < 220000) {
          sessionStorage.setItem(textSessionKey(item.id), payload);
        }
      } catch (e) {}
    }

    function loadItemTextFirst(id, baseItem, triggerEl, clickEvent, forceLive) {
      state.articleTexts = state.articleTexts || {};
      state.loadingTexts = state.loadingTexts || {};
      state.contentFirstShown = state.contentFirstShown || {};
      if (!id) return;
      if (state.articleDetails && state.articleDetails[id] && state.articleDetails[id].contentHtml && !forceLive) return;

      if (!forceLive) {
        const stored = loadTextFromSession(id);
        if (stored) {
          const textItem = Object.assign({}, baseItem || findItem(id) || {}, stored, { isTextOnly: true });
          state.articleTexts[id] = textItem;
          renderItemContentFirst(textItem, triggerEl, clickEvent, true);
          return;
        }
      }

      if (state.loadingTexts[id] && !forceLive) return;
      state.loadingTexts[id] = true;

      google.script.run
        .withSuccessHandler(function(response) {
          state.loadingTexts[id] = false;
          if (!response || !response.ok || !response.item) {
            if (!state.contentFirstShown[id]) showDetailError((response && response.error) || 'No pudimos preparar este contenido.');
            return;
          }
          const existingMedia = state.articleDetails && state.articleDetails[id] ? state.articleDetails[id] : null;
          const textItem = Object.assign({}, baseItem || findItem(id) || {}, existingMedia || {}, response.item, { isLite: false, isTextOnly: true });
          state.articleTexts[id] = textItem;
          saveTextToSession(textItem);
          mergeFullItemIntoEntryPayload(textItem);
          if (state.pendingDetailId === id || (state.currentItem && state.currentItem.id === id)) {
            if (existingMedia && existingMedia.isMediaOnly) {
              const combinedItem = Object.assign({}, existingMedia, textItem, {
                contentHtml: textItem.contentHtml || '',
                isMediaOnly: false,
                isTextOnly: false,
                isLite: false
              });
              state.articleDetails[id] = combinedItem;
              renderItemDetail(combinedItem, triggerEl, clickEvent, true);
            } else {
              renderItemContentFirst(textItem, triggerEl, clickEvent, true);
            }
          }
        })
        .withFailureHandler(function(err) {
          state.loadingTexts[id] = false;
          if (!state.contentFirstShown[id]) {
            showDetailError((err && err.message) ? err.message : String(err || 'No se pudo cargar el contenido principal.'));
          } else {
            updateComplementaryStatus('No pudimos actualizar la información en este momento. Puedes continuar leyendo.');
          }
          console.warn('No se pudo preparar contenido principal', err);
        })
        .getKbItemTextFirst(id, true);
    }

    function loadItemDetail(id, triggerEl, clickEvent, preserveContentFirst) {
      state.loadingDetails = state.loadingDetails || {};
      state.loadingFullDetails = state.loadingFullDetails || {};
      state.articleDetails = state.articleDetails || {};
      if (!id) return;

      if (state.loadingFullDetails[id]) {
        return;
      }
      // v32: media/complement loading is independent from text prefetch.
      // A hover/touch prefetch must never block image, audio, gallery, feedback or related items.
      state.loadingDetails[id] = true;
      state.loadingFullDetails[id] = true;

      const slowTimer = setTimeout(function() {
        if (state.loadingFullDetails && state.loadingFullDetails[id] && state.contentFirstShown && state.contentFirstShown[id]) {
          updateComplementaryStatus('Ya puedes leer el contenido. Estamos preparando recursos de apoyo.');
        }
      }, 4500);

      google.script.run
        .withSuccessHandler(function(response) {
          clearTimeout(slowTimer);
          state.loadingDetails[id] = false;
          state.loadingFullDetails[id] = false;
          if (!response || !response.ok || !response.item) {
            if (!state.contentFirstShown[id]) showDetailError((response && response.error) || 'No pudimos preparar los recursos de apoyo.');
            else updateComplementaryStatus('Algunos recursos de apoyo no cargaron. Puedes continuar leyendo el contenido.');
            return;
          }

          const textItem = state.articleTexts && state.articleTexts[id] ? state.articleTexts[id] : null;
          const fullItem = Object.assign({}, findItem(id) || {}, textItem || {}, response.item, {
            contentHtml: (textItem && textItem.contentHtml) || (response.item && response.item.contentHtml) || '',
            isLite: false,
            isTextOnly: false
          });
          state.articleDetails[id] = fullItem;
          mergeFullItemIntoEntryPayload(fullItem);

          if (state.pendingDetailId === id || (state.currentItem && state.currentItem.id === id)) {
            if (fullItem.contentHtml || state.contentFirstShown[id]) {
              renderItemDetail(fullItem, triggerEl, clickEvent, !!preserveContentFirst || !!state.contentFirstShown[id]);
            }
          }
        })
        .withFailureHandler(function(err) {
          clearTimeout(slowTimer);
          state.loadingDetails[id] = false;
          state.loadingFullDetails[id] = false;
          if (!state.contentFirstShown[id]) {
            showDetailError((err && err.message) ? err.message : String(err || 'No pudimos abrir este contenido.'));
          } else {
            updateComplementaryStatus('Algunos recursos de apoyo no cargaron. Puedes continuar leyendo el contenido.');
          }
        })
        .getKbItemMedia(id, true);
    }

    function updateComplementaryStatus(message) {
      const slot = document.getElementById('contentFirstMediaSlot');
      if (!slot) return;
      slot.classList.add('is-loading');
      slot.innerHTML = `<div class="media-inline-status">${escapeHtml(message || 'Preparando recursos de apoyo...')}</div>`;
    }

    function showDetailError(message) {
      els.sheetBody.innerHTML = `
        <div class="error detail-error">
          No pudimos abrir este contenido.<br>
          <small>${escapeHtml(message || '')}</small>
        </div>`;
    }

    function mergeFullItemIntoEntryPayload(fullItem) {
      if (!fullItem || !fullItem.id) return;
      const entryId = fullItem.entryPoint || state.entry;
      const payload = state.entryPayloads[entryId];
      if (!payload || !Array.isArray(payload.items)) return;
      const idx = payload.items.findIndex(function(item) { return item.id === fullItem.id; });
      if (idx >= 0) payload.items[idx] = Object.assign({}, payload.items[idx], fullItem, { isLite: false });
    }

    function renderItemContentFirst(item, triggerEl, clickEvent, preserveScroll) {
      if (!item) return;
      state.currentItem = item;
      state.feedbackSubmitting = false;
      state.pendingDetailId = item.id;
      state.contentFirstShown = state.contentFirstShown || {};
      state.contentFirstShown[item.id] = true;

      const previousScroll = preserveScroll ? els.sheetBody.scrollTop : 0;
      els.sheetTitle.textContent = item.title || 'Artículo';
      els.sheetSubtitle.textContent = [item.entryLabel, item.category, item.subCategory].filter(Boolean).join(' / ');
      els.sheetBody.innerHTML = `
        <article class="article">${sanitizeRichHtml(item.contentHtml || '<p>Sin contenido detallado.</p>')}</article>
        <div class="content-first-media is-loading" id="contentFirstMediaSlot">
          <div class="media-inline-status">Preparando recursos de apoyo...</div>
        </div>`;

      positionDesktopModal(triggerEl, clickEvent);
      document.body.classList.add('modal-open');
      els.backdrop.classList.add('show');
      els.sheet.classList.add('show');
      els.sheetBody.scrollTop = previousScroll || 0;
    }

    function renderItemDetail(item, triggerEl, clickEvent, preserveScroll) {
      if (!item) return;
      state.currentItem = item;
      state.feedbackSubmitting = false;
      state.pendingDetailId = item.id;

      els.sheetTitle.textContent = item.title;
      els.sheetSubtitle.textContent = [item.entryLabel, item.category, item.subCategory].filter(Boolean).join(' / ');

      const previousScroll = preserveScroll ? els.sheetBody.scrollTop : 0;
      const img = item.hasImage && item.imageId ? `<div class="image-placeholder" id="imageSlot-${escapeAttr(item.id)}">Preparando imagen...</div>` : '';
      const gallery = item.hasGallery && item.galleryIds && item.galleryIds.length ? renderImageGalleryShell(item) : '';
      const audio = item.hasAudio && item.audioId ? renderAudioShell(item) : '';
      const governanceBox = renderGovernanceBox(item);
      const mediaBlock = (img || gallery || audio) ? `
        <div class="content-first-media">
          <h3 class="content-first-media-title">Recursos de apoyo</h3>
          ${img}
          ${gallery}
          ${audio}
        </div>` : '';

      els.sheetBody.innerHTML = `
        <article class="article">${sanitizeRichHtml(item.contentHtml || '<p>Sin contenido detallado.</p>')}</article>
        ${mediaBlock}
        <div class="meta-grid compact-meta-grid">
          <div class="meta-box"><span>Owner</span><strong>${escapeHtml(item.owner || 'No definido')}</strong></div>
          <div class="meta-box"><span>Actualización</span><strong>${escapeHtml(item.updatedAt || 'No definida')}</strong></div>
        </div>
        <div class="article-actions">
          <button type="button" class="fav-inline ${isFavorite(item.id) ? 'active' : ''}" id="favoriteArticleBtn">${isFavorite(item.id) ? '❤️ Quitar de favoritos' : '❤️ Añadir a favoritos'}</button>
          ${shouldShowCopyButton(item) ? '<button type="button" class="copy-btn" id="copyArticleBtn">Copiar respuesta</button><span class="copy-status" id="copyStatus"></span>' : ''}
        </div>
        <div class="feedback">
          <strong>¿Te sirvió?</strong>
          <button type="button" class="primary" data-feedback="yes">Sí</button>
          <button type="button" data-feedback="no">No</button>
        </div>
        <div class="feedback-panel" id="negativeFeedbackPanel">
          <label for="negativeReason">¿Qué podemos mejorar?</label>
          <select id="negativeReason">
            <option value="Información incompleta">La información está incompleta</option>
            <option value="Información desactualizada">La información está desactualizada</option>
            <option value="No encontré lo que buscaba">No encontré lo que buscaba</option>
            <option value="No es clara">La respuesta no es clara</option>
            <option value="Otro">Otro</option>
          </select>
          <label for="negativeComment">Comentario</label>
          <textarea id="negativeComment" placeholder="Escribe qué faltó, qué está confuso o qué esperabas encontrar..."></textarea>
          <div class="feedback-actions">
            <button type="button" id="cancelNegativeFeedback">Cancelar</button>

    function positionDesktopModal(triggerEl, clickEvent) {
      if (!els.sheet) return;
      const isDesktop = window.matchMedia && window.matchMedia('(min-width: 761px)').matches;
      if (!isDesktop) {
        els.sheet.style.removeProperty('--desktop-modal-top');
        els.sheet.style.removeProperty('--desktop-modal-max-height');
        els.sheetBody.style.removeProperty('--desktop-sheet-body-max-height');
        return;
      }

      // v15: Clamp the desktop pop-up so it never opens too low and gets cut off.
      // This matters in Google Sites because the KB is inside a tall iframe and the
      // parent page scroll is outside this document. We anchor near the clicked card,
      // but reserve enough space below for the full modal. If the card is near the
      // lower part of the embed, the modal shifts upward automatically.
      const doc = document.documentElement;
      const body = document.body;
      const scrollY = window.pageYOffset || doc.scrollTop || body.scrollTop || 0;
      const docHeight = Math.max(
        doc.scrollHeight || 0,
        body.scrollHeight || 0,
        doc.clientHeight || 0,
        window.innerHeight || 0
      );
      const viewportHeight = Math.max(520, Math.min(window.innerHeight || 720, doc.clientHeight || 720));
      const desiredModalHeight = Math.min(720, Math.max(520, viewportHeight - 48));

      els.sheet.style.setProperty('--desktop-modal-max-height', desiredModalHeight + 'px');
      els.sheetBody.style.setProperty('--desktop-sheet-body-max-height', Math.max(320, desiredModalHeight - 126) + 'px');

      const source = triggerEl || document.activeElement || els.view;
      let anchorTop = scrollY + 28;
      let anchorHeight = 60;

      if (source && typeof source.getBoundingClientRect === 'function') {
        const rect = source.getBoundingClientRect();
        anchorTop = scrollY + rect.top;
        anchorHeight = rect.height || 60;
      }

      // Prefer a position slightly above the clicked card so the header is visible
      // immediately and the user does not need to scroll back up.
      let top = anchorTop - Math.min(220, Math.round(desiredModalHeight * 0.32));

      // If the card is very close to the bottom of the document/embed, shift the
      // modal upward enough so its lower edge remains inside the embed.
      const minTop = 16;
      const maxTop = Math.max(minTop, docHeight - desiredModalHeight - 24);
      top = Math.max(minTop, Math.min(top, maxTop));

      // If the click happened on a visible control, keep the pop-up close to that
      // interaction point without letting it exceed the same safe bounds.
      if (clickEvent && typeof clickEvent.clientY === 'number' && clickEvent.clientY > 0) {
        const clickBasedTop = scrollY + clickEvent.clientY - Math.min(240, Math.round(desiredModalHeight * 0.38));
        top = Math.max(minTop, Math.min(clickBasedTop, maxTop));
      }

      els.sheet.style.setProperty('--desktop-modal-top', Math.round(top) + 'px');
    }


    function loadItemImage(item) {
      const slotId = 'imageSlot-' + item.id;
      const slot = document.getElementById(slotId);
      if (!slot || !item.imageId) return;

      const directSrc = buildDriveThumbnailUrl(item.imageId, 1400);
      const img = document.createElement('img');
      img.className = 'hero-image';
      img.id = slotId;
      img.alt = item.title || 'Imagen del contenido';
      img.loading = 'lazy';
      img.decoding = 'async';
      img.src = directSrc;
      img.onerror = function() {
        loadItemImageFallback(item, slotId);
      };
      slot.replaceWith(img);
    }

    function loadItemImageFallback(item, slotId) {
      const current = document.getElementById(slotId);
      if (state.imageFallbackCache[item.imageId]) {
        renderLoadedImage(current, state.imageFallbackCache[item.imageId], item.title);
        return;
      }

      const holder = document.createElement('div');
      holder.className = 'image-placeholder';
      holder.id = slotId;
      holder.textContent = 'Preparando imagen en modo compatible...';
      if (current) current.replaceWith(holder);

      google.script.run
        .withSuccessHandler(function(response) {
          const latest = document.getElementById(slotId);
          if (!latest) return;
          if (response && response.ok && response.src) {
            state.imageFallbackCache[item.imageId] = response.src;
            renderLoadedImage(latest, response.src, item.title);
          } else {
            latest.classList.add('error');
            latest.textContent = 'No se pudo cargar la imagen.';
          }
        })
        .withFailureHandler(function(err) {
          const latest = document.getElementById(slotId);
          if (!latest) return;
          latest.classList.add('error');
          latest.textContent = 'No se pudo cargar la imagen.';
          console.error(err);
        })
        .getImageDataById(item.imageId);
    }

    function renderLoadedImage(slot, src, title) {
      if (!slot) return;
      const img = document.createElement('img');
      img.className = 'hero-image';
      img.src = src;
      img.alt = title || 'Imagen del contenido';
      img.loading = 'lazy';
      img.decoding = 'async';
      slot.replaceWith(img);
    }

    function renderImageGalleryShell(item) {
      const ids = Array.isArray(item.galleryIds) ? item.galleryIds : [];
      if (!ids.length) return '';
      const title = item.galleryTitle || 'Galería de imágenes';
      const multiple = ids.length > 1;
      return `
        <section class="gallery-block" id="gallery-${escapeAttr(item.id)}" data-gallery-index="0">
          <div class="gallery-head">
            <h3>${escapeHtml(title)}</h3>
            <span class="gallery-count" id="galleryCount-${escapeAttr(item.id)}">1 / ${ids.length}</span>
          </div>
          <div class="gallery-viewport">
            <button type="button" class="gallery-nav prev" id="galleryPrev-${escapeAttr(item.id)}" aria-label="Imagen anterior" ${multiple ? '' : 'disabled'}>‹</button>
            <div class="gallery-media" id="galleryMedia-${escapeAttr(item.id)}"><div class="gallery-placeholder">Preparando galería...</div></div>
            <button type="button" class="gallery-nav next" id="galleryNext-${escapeAttr(item.id)}" aria-label="Imagen siguiente" ${multiple ? '' : 'disabled'}>›</button>
          </div>
          ${multiple ? `<div class="gallery-dots" id="galleryDots-${escapeAttr(item.id)}">${ids.map(function(_, index) {
            return `<button type="button" class="gallery-dot ${index === 0 ? 'active' : ''}" data-gallery-dot="${index}" aria-label="Ver imagen ${index + 1}"></button>`;
          }).join('')}</div>` : ''}
        </section>`;
    }

    function loadItemGallery(item) {
      const ids = Array.isArray(item.galleryIds) ? item.galleryIds : [];
      if (!ids.length) return;

      const block = document.getElementById('gallery-' + item.id);
      const media = document.getElementById('galleryMedia-' + item.id);
      const prev = document.getElementById('galleryPrev-' + item.id);
      const next = document.getElementById('galleryNext-' + item.id);
      const count = document.getElementById('galleryCount-' + item.id);
      const dots = Array.from(document.querySelectorAll('#galleryDots-' + cssEscape(item.id) + ' [data-gallery-dot]'));
      if (!block || !media) return;

      function setIndex(nextIndex) {
        const clamped = Math.max(0, Math.min(ids.length - 1, Number(nextIndex) || 0));
        block.dataset.galleryIndex = String(clamped);
        if (count) count.textContent = (clamped + 1) + ' / ' + ids.length;
        if (prev) prev.disabled = ids.length <= 1;
        if (next) next.disabled = ids.length <= 1;
        dots.forEach(function(dot) {
          dot.classList.toggle('active', Number(dot.dataset.galleryDot) === clamped);
        });
        renderGalleryImage(item, clamped);
      }

      if (prev) prev.addEventListener('click', function() {
        const current = Number(block.dataset.galleryIndex || 0);
        setIndex((current - 1 + ids.length) % ids.length);
      });
      if (next) next.addEventListener('click', function() {
        const current = Number(block.dataset.galleryIndex || 0);
        setIndex((current + 1) % ids.length);
      });
      dots.forEach(function(dot) {
        dot.addEventListener('click', function() { setIndex(Number(dot.dataset.galleryDot || 0)); });
      });

      setIndex(0);
    }

    function renderGalleryImage(item, index) {
      const ids = Array.isArray(item.galleryIds) ? item.galleryIds : [];

      if (!media || !imageId) return;

      const img = document.createElement('img');
      img.className = 'gallery-img';
      img.alt = (item.galleryTitle || item.title || 'Imagen de galería') + ' ' + (index + 1);
      img.loading = 'lazy';
      img.decoding = 'async';
      img.src = buildDriveThumbnailUrl(imageId, 1600);
      img.onerror = function() { loadGalleryImageFallback(item, index); };

    function loadGalleryImageFallback(item, index) {
      const ids = Array.isArray(item.galleryIds) ? item.galleryIds : [];
      const imageId = ids[index];
      const media = document.getElementById('galleryMedia-' + item.id);
      const block = document.getElementById('gallery-' + item.id);
      if (!media || !imageId || !block) return;

      const currentIndex = Number(block.dataset.galleryIndex || 0);
      if (currentIndex !== index) return;

      if (state.imageFallbackCache[imageId]) {
        renderGalleryImageFromSrc(item, index, state.imageFallbackCache[imageId]);
        return;
      }

      media.innerHTML = '<div class="gallery-placeholder">Preparando imagen en modo compatible...</div>';
      google.script.run
        .withSuccessHandler(function(response) {
          const latestBlock = document.getElementById('gallery-' + item.id);
          if (!latestBlock || Number(latestBlock.dataset.galleryIndex || 0) !== index) return;
          if (response && response.ok && response.src) {
            state.imageFallbackCache[imageId] = response.src;
            renderGalleryImageFromSrc(item, index, response.src);
          } else {
            renderGalleryError(item);
          }
        })
        .withFailureHandler(function(err) {
          console.error(err);
          renderGalleryError(item);
        })
        .getImageDataById(imageId);
    }

    function renderGalleryImageFromSrc(item, index, src) {

    function cssEscape(value) {
      if (window.CSS && typeof window.CSS.escape === 'function') return window.CSS.escape(String(value));
      return String(value).replace(/[^a-zA-Z0-9_-]/g, '\\$&');
    }

    function loadItemAudio(item) {
      const slotId = 'audioSlot-' + item.id;
      const slot = document.getElementById(slotId);
      if (!slot || !item.audioId) return;

      // v10: Google Drive does not reliably allow HTML5 <audio> to play files through
      // uc?export=download inside a Google Sites / Apps Script iframe. The Drive preview
      // URL is more stable because it uses Google's own embedded media player.
      renderDrivePreviewAudio(slot, item.audioId, item.audioTitle || item.title, item);

    function renderDrivePreviewAudio(slot, fileId, title, item) {
      if (!slot) return;
      const wrap = document.createElement('div');
      wrap.className = 'audio-player-wrap';

      const frame = document.createElement('iframe');
      frame.className = 'audio-preview-frame';
      frame.src = buildDrivePreviewUrl(fileId);
      frame.setAttribute('title', title || 'Audio de apoyo');
      frame.setAttribute('allow', 'autoplay');
      frame.setAttribute('loading', 'lazy');

      const helper = document.createElement('div');
      helper.className = 'audio-helper';
      helper.textContent = 'Si el audio no se reproduce, usa el modo compatible.';

      const fallback = document.createElement('button');
      fallback.type = 'button';
      fallback.className = 'audio-fallback-btn';
      fallback.textContent = 'Cargar en modo compatible';
      fallback.addEventListener('click', function() {
        loadItemAudioFallback(item, wrap);
      });

      wrap.appendChild(frame);
      wrap.appendChild(helper);
      wrap.appendChild(fallback);
      slot.replaceWith(wrap);
    }

    function loadItemAudioFallback(item, container) {
      if (!item || !item.audioId || !container) return;
      container.innerHTML = '<div class="audio-placeholder">Preparando audio en modo compatible...</div>';

      if (state.audioFallbackCache[item.audioId]) {
        const slot = container.querySelector('.audio-placeholder') || container;
        renderLoadedAudioBase64(slot, state.audioFallbackCache[item.audioId], item.audioTitle || item.title);
        return;
      }

      google.script.run
        .withSuccessHandler(function(response) {
          const slot = container.querySelector('.audio-placeholder') || container;
          if (response && response.ok && response.src) {
            state.audioFallbackCache[item.audioId] = response.src;
            renderLoadedAudioBase64(slot, response.src, item.audioTitle || item.title);
          } else {
            container.innerHTML = '<div class="audio-placeholder error">No se pudo cargar el audio.</div>';
          }
        })
        .withFailureHandler(function(err) {
          container.innerHTML = '<div class="audio-placeholder error">No se pudo cargar el audio.</div>';
          console.error(err);
        })
        .getAudioDataById(item.audioId);
    }

    function renderLoadedAudioBase64(slot, src, title) {
      const audio = document.createElement('audio');
      audio.controls = true;
      audio.preload = 'none';
      audio.src = src;
      audio.setAttribute('aria-label', title || 'Audio de apoyo');
      slot.replaceWith(audio);
    }

    function sendFeedback(isHelpful, reason, comment) {
      const item = state.currentItem;
      if (!item) return;
      if (isFeedbackBlocked(item)) {
        showFeedbackModal('success', 'Feedback recibido', 'Ya guardamos tu feedback para este artículo.');

        .withSuccessHandler(function() {
          markFeedbackSent();

          showFeedbackModal('error', 'No se pudo enviar', 'Intenta nuevamente en unos segundos.');
        })
        .submitFeedback({

    function copyCurrentArticle() {
      const item = state.currentItem;
      if (!item) return;
      const text = [
        item.title,
        item.summary || '',
        stripHtml(item.contentHtml || ''),
        item.updatedAt ? 'Actualización: ' + item.updatedAt : '',
        item.version ? 'Versión: ' + item.version : ''
      ].filter(Boolean).join('\n\n');

      const status = document.getElementById('copyStatus');
      function done(ok) {
        showToast(ok ? 'Respuesta copiada' : 'No se pudo copiar');
        if (status) status.textContent = ok ? 'Copiado' : 'No se pudo copiar';
        if (status) setTimeout(function() { status.textContent = ''; }, 1800);
      }

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function() { done(true); }).catch(function() { fallbackCopyText(text, done); });
      } else {
        fallbackCopyText(text, done);
      }
    }

    function fallbackCopyText(text, callback) {
      const area = document.createElement('textarea');
      area.value = text;
      area.style.position = 'fixed';
      area.style.left = '-9999px';
      document.body.appendChild(area);
      area.focus();
      area.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
      document.body.removeChild(area);
      callback(ok);
    }

    function scheduleSearchLog(resultsCount) {
      const query = (state.query || '').trim();
      const category = state.category || 'all';
      if (!query && category === 'all') return;
      if (query && query.length < 2 && category === 'all') return;
      const key = [state.entry || '', query, category, resultsCount].join('|');
      if (key === state.lastLoggedSearchKey) return;
      clearTimeout(state.searchLogTimer);
      state.searchLogTimer = setTimeout(function() {
        state.lastLoggedSearchKey = key;
        google.script.run
          .withFailureHandler(function(err) { console.warn('Search log failed', err); })
          .logSearch({
            query: query,
            entryPoint: state.entry || '',
            categoryFilter: category,
            resultsCount: resultsCount,
            userAgent: navigator.userAgent
          });
      }, 900);
    }

    function getEntryPoints() {
      if (state.shell && state.shell.entryPoints && state.shell.entryPoints.length) return state.shell.entryPoints;
      if (state.data && state.data.entryPoints && state.data.entryPoints.length) return state.data.entryPoints;

    function getEntryCount(entryId) {
      if (state.shell && state.shell.counts && state.shell.counts[entryId]) return state.shell.counts[entryId];
      if (state.entryPayloads[entryId] && state.entryPayloads[entryId].counts && state.entryPayloads[entryId].counts[entryId]) return state.entryPayloads[entryId].counts[entryId];
      return 0;
    }

    function getEntryPoint(id) {
      return getEntryPoints().find(function(ep) { return ep.id === id; }) || { id: id, label: id || 'Knowledge Base' };
    }

    function getItemsForEntry(entry) {
      const payload = state.entryPayloads[entry] || state.data || { items: [] };
      return (payload.items || []).filter(function(item) { return item.entryPoint === entry; });
    }

    function getCategoriesForEntry(entry, items) {
      const bySheet = (state.data.categories || []).filter(function(c) { return c.entryPoint === entry; });
      const names = {};
      bySheet.forEach(function(c) { names[c.name] = c; });

        }

        return;
      }

      var articleButton = target.closest('[data-open], [data-related]');
      if (articleButton) {
        var article = articleFromButton(articleButton);
        if (article) {
          setContext({
            view: 'article',
            entryPoint: article.entryPoint,
            articleId: article.id,
            articleTitle: article.title
          });

          track('article_open', {
            view: 'article',
            entry_point: article.entryPoint,
            article_id: article.id,
            article_title: article.title,
            metadata: { source: 'article_card' }
          });
        }

        return;
      }

      var feedback = target.closest('[data-feedback]');
      if (feedback) {
        var itemId = safeStateValue('currentItem', null);
        track(
          feedback.getAttribute('data-feedback') === 'yes'
            ? 'feedback_yes'
            : 'feedback_no',
          {
            view: 'article',
            article_id:
              itemId && itemId.id ? itemId.id : usageContext.articleId,
            article_title:
              itemId && itemId.title ? itemId.title : usageContext.articleTitle
          }
        );
        return;
      }

      var favorite = target.closest('.fav-inline');
      if (favorite) {
        track('favorite_toggle', {
          view: 'article',
          article_id: usageContext.articleId,
          article_title: usageContext.articleTitle
        });
      }

      var gap = target.closest('#sendContentGap, #homeSendContentGap');
      if (gap) {
        track('content_gap', {
          view: usageContext.view || 'home',
          entry_point: usageContext.entryPoint || '',
          article_id: usageContext.articleId || '',
          article_title: usageContext.articleTitle || '',
          search_query:
            safeStateValue('query', '') ||
            safeStateValue('homeSearchQuery', '') ||
            '',
          metadata: { source: 'content_gap_button' }
        });
      }
    }

    function handleInput(event) {
      var target = event.target;
      if (!target) return;

      if (
        target.id === 'homeGlobalSearchInput' ||
        target.id === 'searchInput'
      ) {
        scheduleSearchEvent(target);
      }
    }

    function heartbeat() {
      track('session_active', {
        view: usageContext.view || 'home',
        entry_point: usageContext.entryPoint || '',
        article_id: usageContext.articleId || '',
        article_title: usageContext.articleTitle || ''
      });
    }

    function initialize() {
      setContext({
        view: 'home',
        entryPoint: '',
        articleId: '',
        articleTitle: ''
      });

      track('kb_open', {
        view: 'home',
        metadata: {
          screenWidth: window.innerWidth || 0,
          screenHeight: window.innerHeight || 0
        }
      });

      setTimeout(heartbeat, 1500);
      setInterval(heartbeat, HEARTBEAT_MS);

      document.addEventListener(
        'click',
        handleDocumentClick,
        true
      );

      document.addEventListener(
        'input',
        handleInput,
        true
      );

      document.addEventListener(
        'visibilitychange',
        function() {
          if (document.hidden) {
            track('tab_hidden', {
              view: usageContext.view || 'home'
            }, true);
          } else {
            track('tab_visible', {
              view: usageContext.view || 'home'
            });
            heartbeat();
          }
        },
        true
      );

      window.addEventListener(
        'beforeunload',
        function() {
          track('session_close', {
            view: usageContext.view || 'home'
          }, true);
        },
        true
      );
    }

    if (document.readyState === 'loading') {
      document.addEventListener(
        'DOMContentLoaded',
        initialize,
        { once: true }
      );
    } else {
      initialize();
    }

  })();
  </script>


</body>
</html>
